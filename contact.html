<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Prakash Dental Clinic</title>
  <link rel="shortcut icon" href="assets/images/fav.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html" aria-label="Prakash Dental Clinic home">
        <img src="assets/images/icon/Color logo - no background_2.png" alt="Prakash Dental Clinic">
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="aboutus.html">About Us</a>
        <a href="services.html">Services</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact Us</a>
      </nav>
      <a class="header-cta" href="https://wa.me/919415237578">Contact Us</a>
      <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="shell">
        <h1>Contact US</h1>
      </div>
    </section>

    <iframe class="map-frame" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d249759.19784092825!2d79.10145254589841!3d12.009924873581818!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1448883859107" allowfullscreen loading="lazy" title="Clinic map"></iframe>

    <section class="page-body">
      <div class="shell contact-layout">
        <div class="contact-form reveal">
          <h2>Contact Form</h2>
          <div class="field">
            <label for="name">Enter Name</label>
            <input id="name" type="text" placeholder="Enter Name" name="name">
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="Enter Email Address" name="email">
          </div>
          <div class="field">
            <label for="mobile">Mobile Number</label>
            <input id="mobile" type="text" placeholder="Enter Mobile Number" name="mobile">
          </div>
          <div class="field">
            <label for="message">Enter Message</label>
            <textarea id="message" rows="5" placeholder="Enter Your Message"></textarea>
          </div>
          <button class="btn btn-primary" type="button">Send Message</button>
        </div>
        <div class="reveal">
          <h2>Address</h2>
          <p>Antonya Street,<br>
            23/H-2, Building<br>
            TA, AUS District<br>
            Phone:+91 9159669599<br>
            Email:support@smarteyeapps.com<br>
            Website:www.smarteyeapps.com.com</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <a href="index.html">Prakash Dental Clinic</a>
    </div>
  </footer>
  <script src="assets/js/script.js"></script>
</body>
</html>
